name: refresco

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: refresco
      POSTGRES_USER: refresco
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U refresco -d refresco"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks: [backend]

  api:
    build: { context: ./backend }
    image: refresco/api:${VERSION:-latest}
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: postgres://refresco:${POSTGRES_PASSWORD}@db:5432/refresco?sslmode=disable
      TRUSTED_PROXIES: 172.16.0.0/12,10.0.0.0/8,192.168.0.0/16
    depends_on: { db: { condition: service_healthy } }
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [backend, edge]

  web:
    build: { context: ./frontend }
    image: refresco/web:${VERSION:-latest}
    restart: unless-stopped
    depends_on: [api]
    ports: ["${WEB_PORT:-8080}:8080"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    networks: [edge]

volumes:
  pgdata:

networks:
  backend: { internal: true }
  edge: {}
